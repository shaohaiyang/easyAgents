[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "easyagents"
version = "0.1.0"
description = "Multi-agent workbench built on Pydantic AI"
requires-python = ">=3.11"
dependencies = [
    "pydantic-ai>=0.0.30",
    "pydantic>=2.0",
    "logfire>=3.0",
    "duckduckgo-search>=6.0",
    "httpx>=0.27",
    "typer>=0.12",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.scripts]
easyagents = "easyagents.cli.main:app"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/easyagents"]
